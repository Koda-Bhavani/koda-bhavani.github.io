<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Bhavani through the portfolio contact form.">

    <meta name="author"
          content="Bhavani">

    <title>Bhavani | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Contact Me</h1>

    <nav aria-label="Main navigation">
        <ul>
            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

            <li>
                <a href="projects.html">Projects</a>
            </li>

            <li>
                <a href="contact.html" aria-current="page">
                    Contact
                </a>
            </li>
        </ul>
    </nav>
</header>

<main>

    <section aria-labelledby="contact-heading">

        <h2 id="contact-heading">Get In Touch</h2>

        <p>
            If you would like to contact me,
            please fill out the form below.
        </p>

        <form action="#" method="post">

            <p>
                <label for="name">Full Name:</label>
                <br>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required>
            </p>

            <p>
                <label for="email">Email Address:</label>
                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>
            </p>

            <p>
                <label for="subject">Subject:</label>
                <br>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    required>
            </p>

            <p>
                <label for="message">Message:</label>
                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    cols="40"
                    required></textarea>
            </p>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer>
    <p>
        &copy; 2026 Bhavani. All rights reserved.
    </p>
</footer>

</body>
</html>
